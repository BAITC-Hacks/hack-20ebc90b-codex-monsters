[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekt-replenishment"
version = "0.1.0"
description = "Buyer-controlled replenishment MVP for HackAlem"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "duckdb>=1.1,<2",
  "pyarrow>=17,<24",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1",
  "streamlit>=1.39,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ekt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
