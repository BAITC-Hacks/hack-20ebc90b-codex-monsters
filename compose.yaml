services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${EKT_BIND_ADDRESS:-127.0.0.1}:${EKT_UI_PORT:-8501}:8501"
    environment:
      PORT: "8501"
      EKT_DATA_DIR: /app/var
      EKT_DEMO_ACTOR: demo-buyer
      EKT_DEMO_ROLE: approver
      BUYER_LOCK_CONNECTION: "true"
    volumes:
      - ekt-data:/app/var
    stop_grace_period: 30s

  # Optional temporary HTTPS link. Requires this computer and Docker to stay on.
  # The URL is printed by: docker compose logs tunnel
  tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles: [share]
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://app:8501
    depends_on:
      app:
        condition: service_healthy

volumes:
  ekt-data:
