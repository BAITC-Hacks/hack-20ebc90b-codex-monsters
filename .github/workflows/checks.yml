name: MVP checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.14
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - name: Real HTTP buyer workflow on synthetic data
        shell: bash
        run: |
          uv run uvicorn ekt.api.app:app --host 127.0.0.1 --port 8000 > /tmp/ekt-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/v1/health > /dev/null; then break; fi
            sleep 0.25
          done
          uv run python scripts/smoke_api.py
