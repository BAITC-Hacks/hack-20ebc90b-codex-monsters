name: MVP checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.14
      - run: uv sync --frozen
      - run: uv run ruff check src apps tests scripts
      - run: uv run pytest -q
      - name: Combined application and real buyer workflow on synthetic data
        shell: bash
        run: |
          .venv/bin/python scripts/run_app.py > /tmp/ekt-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if .venv/bin/python scripts/check_health.py > /dev/null 2>&1; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat /tmp/ekt-app.log; exit 1; fi
            sleep 0.25
          done
          .venv/bin/python scripts/check_health.py || { cat /tmp/ekt-app.log; exit 1; }
          uv run python scripts/smoke_api.py
